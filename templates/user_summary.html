<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Summary</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #e3f2fd;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .stat-box {
            padding: 20px;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center"> {{ user.username }}'s Performance </h2>

    <div class="row">
        <div class="col-md-4">
            <div class="stat-box">Quizzes Attempted: {{ num_quizzes }}</div>
        </div>
        <div class="col-md-4">
            <div class="stat-box">Avg. Score: {{ avg_score }}%</div>
        </div>
        <div class="col-md-4">
            <div class="stat-box">Best Score: {{ best_quiz }} - {{ best_score }}% </div>
        </div>
    </div>

    <div class="text-center">{{ graph_html|safe }}</div>

    <div class="text-center mt-3">
        <a href="{{ url_for('controllers.user_dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
