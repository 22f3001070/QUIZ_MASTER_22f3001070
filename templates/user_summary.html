<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Summary</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="icon" href=
    "{{ url_for('static', filename='images/logo.png') }}"
            type="image/x-icon" />
    <style>
        body {
            background-color: #e3f2fd;
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='images/pic_6.jpg') }}"); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .container {
            margin-top: 30px;
            background: rgba(81, 3, 125, 0.69);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .stat-box {
            padding: 20px;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
        }
        header.logo
        {
            position: absolute;
            right: 30px;
            top: 13.3px;
            
            height:10px;
            margin-top: 5px 0;
            box-shadow: 0px 4px 22px rgba(133, 36, 202, 0.86);
            
        }
        h2.h{
            color: purple;
            background: rgba(134, 206, 232, 0.88);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="h"> {{ user.username }}'s Performance </h2>
    <header class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Quiz Master Logo" width="50">
    </header>

    <div class="row">
        <div class="col-md-4">
            <div class="stat-box">Quizzes Attempted: {{ num_quizzes }}</div>
        </div>
        <div class="col-md-4">
            <div class="stat-box">Avg. Score: {{ avg_score }}%</div>
        </div>
        <div class="col-md-4">
            <div class="stat-box">Best Score: {{ best_quiz }} - {{ best_score }}% </div>
        </div>
    </div>

    <div class="text-center">{{ graph_html|safe }}</div>

    <div class="text-center mt-3">
        <a href="{{ url_for('controllers.user_dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
