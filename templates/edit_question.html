<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href=
    "{{ url_for('static', filename='images/logo.png') }}"
            type="image/x-icon" />
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: rgb(237, 233, 233);
        }

       




        .btn-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }




        .chapter-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .chapter-container h2 {
            color: orange;
            text-align: center;
            font-size: 24px;
        }
        .chapter-container label {
            font-weight: bold;
            color: blue;
            font-size: 18px;
            display: block;
            margin-top: 15px;
        }
        .chapter-container input, .chapter-container textarea {
            width: 100%;
            font-size: 16px;
            padding: 10px;
            margin-top: 5px;
        }
        header.logo
        {
            position: absolute;
            right: 30px;
            top: 13.3px;
            
            height:10px;
            margin-top: 5px 0;
            box-shadow: 0px 4px 22px rgba(37, 214, 152, 0.86);
            
        }



    </style>
</head>
<body>

    <h1> Edit Question </h1>
    <header class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Quiz Master Logo" width="50">
    </header>
    <h2 style="text-align: center; color: green;">{{ question.title }}</h2>


    <div class = "chapter-container">
        <form method="POST" action="{{ url_for('controllers.edit_question', question_id = question.id, quiz_id = quiz.id) }}">
            <!--
            <div>
                <label for="qid">Q_id :</label>
                <input type="number" id="qid" name="qid" required>
            </div>-->

            <div>
                <label for="qtitle">Q_Title :</label>
                <input type="text" id="qtitle" name="qtitle" value="{{ question.title }}" required>
            </div>
            
            <div>
                <label for="qstatement">Q_statement :</label>
                <textarea id="qstatement" name="qstatement" required>{{ question.statement }}</textarea>
            </div>

            <div>



            </div class = "chapter-container">
                <h3>Creating options<h3>
                
                <div>
                    <label for="op1">Option-1 :</label>
                    <input type="text" id="op1" name="op1" value="{{ question.option_a }}" required>
                </div>

                <div>
                    <label for="op2">Option-2 :</label>
                    <input type="text" id="op2" name="op2" value="{{ question.option_b }}" required>
                </div>

                <div>
                    <label for="op3">Option-3 :</label>
                    <input type="text" id="op3" name="op3" value="{{ question.option_c }}" required>
                </div>

                <div>
                    <label for="op4">Option-4 :</label>
                    <input type="text" id="op4" name="op4" value="{{ question.option_d }}" required>
                </div>


                <div>
                    <label for="cop">Correct option :</label> <!--A,B,C,D-->
                    <input type="text" id="cop" name="cop" value="{{ question.correct_option }}" required>
                </div>


            


            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Update</button>
                <a href="{{ url_for('controllers.admin_quizzes') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>


   


</body>


</html>
