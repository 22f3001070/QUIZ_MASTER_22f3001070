<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: rgb(237, 233, 233);
        }

       




        .btn-group {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }




        .chapter-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .chapter-container h2 {
            color: orange;
            text-align: center;
            font-size: 24px;
        }
        .chapter-container label {
            font-weight: bold;
            color: blue;
            font-size: 18px;
            display: block;
            margin-top: 15px;
        }
        .chapter-container input, .chapter-container textarea {
            width: 100%;
            font-size: 16px;
            padding: 10px;
            margin-top: 5px;
        }
        header.logo
        {
            position: absolute;
            right: 30px;
            top: 13.3px;
            
            height:10px;
            margin-top: 5px 0;
            box-shadow: 0px 4px 22px rgba(37, 214, 152, 0.86);
            
        }



    </style>
</head>
<body>

    <h1> New Quiz </h1>
    <header class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Quiz Master Logo" width="50">
    </header>
    <h2 style="text-align: center; color: green;">{{ chapter.name }}</h2>

    <div class = "chapter-container">
        <form method="POST" action="{{ url_for('controllers.create_quiz',chapter_id = chapter.id,subject_id = subject.id) }}">
            <div>
                <label for="qname">Title :</label>
                <input type="text" id="qname" name="qname" required>
            </div>

            <div>
                <label for="qdate">Date :</label>
                <input type="date" id="qdate" name="qdate" required>
            </div>
            
            <div>
                <label for="qtime">Time :</label>
                <input type="time" id="qtime" name="qtime" required>
            </div>

            <div>
                <label for="qduration">Duration (minutes) :</label>
                <input type="number" id="qduration" name="qduration" required>
            </div>
            <div>
                <label for="qrules">Rules :</label>
                <textarea id="qrules" name="qrules" required></textarea>
            </div>
            


            <div class="btn-group">
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{{ url_for('controllers.admin_quiz_management') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>


   


</body>


</html>
