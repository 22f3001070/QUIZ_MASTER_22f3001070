<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Attempt</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--<meta http-equiv="refresh" content="1">-->  <!-- Auto-refresh for timer -->

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgb(222, 222, 235);
            position: relative;
        }

        
        .timer-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 5px rgba(244, 132, 122, 0.49);
            font-weight: bold;
            font-size: 1.2rem;
            color: #dc3545;
        }

        
        .quiz-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(161, 8, 249, 0.75);
            width: 60%;
            text-align: center;
        }

        .question {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .options label {
            display: block;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            margin: 5px 0;
            cursor: pointer;
        }

        .submit-btn {
            margin-top: 20px;
        }
        h4.Q{
            left:20px;
            top:20px;
            position:absolute;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: white;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(79, 92, 237, 0.86);

        }
        header.logo
        {
            position: absolute;
            right: 712.5px;
            top: 15px;
            
            height:10px;
            margin-top: 5px 0;
            
           
           

            box-shadow: 0px 4px 22px rgba(87, 56, 239, 0.86);
            
        }

    </style>
</head>
<body>

    <h4 class ="Q">Question {{ current_index + 1 }} of {{ total_questions }}</h4>


    <header class="logo">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Quiz Master Logo" width="110" >
    </header>


    

    <!-- Timer at top-right -->
    <div class="timer-box">
        Time Remaining: <span id="timer">{{ (remaining_time // 60) }}:{% if (remaining_time % 60) < 10 %}0{% endif %}{{ remaining_time % 60 }}</span>
    </div>

    <!-- Quiz Box -->
    <div class="quiz-container">
        
        


        <form id="quizSubmit" method="POST" action="{{ url_for('controllers.attempt_quiz', quiz_id=quiz_id) }}">
            <div class="question">
                
                <p>{{ question.statement }}</p>
            </div>
        
            <div class="options">
                <label><input type="radio" name="selected_option" value="A"> {{ question.option_a }}</label> <!--Placeholder can be added!-->
                <label><input type="radio" name="selected_option" value="B"> {{ question.option_b }}</label>
                <label><input type="radio" name="selected_option" value="C"> {{ question.option_c }}</label>
                <label><input type="radio" name="selected_option" value="D"> {{ question.option_d }}</label>
            </div>
        
            <div class="buttons"> 
                {% if current_index > 0 %}
                    <button type="submit" name="prev" class="btn btn-secondary">Previous</button>
                {% endif %}
                
                {% if current_index < total_questions - 1 %}
                    <button type="submit" name="next" class="btn btn-primary">Save and Next</button>
                {% endif %}
                <button type="submit" name="submit" id ="sub" class="btn btn-success" >Submit</button>
            </div>
        </form>

    </div>

    <script>  // Using html the problem was it was refreshing my whole page again leading to reseting of myreponses to the Q, so used JS instead. 
        // JS timer update
        let remainingTime = {{ remaining_time }};  // Fetch remaining time from flask controller
        let timerElement = document.getElementById('timer');
        let quizForm = document.getElementById('quizSubmit');
        let timerActive = true; // Flag to prevent multiple submissions 

        function AutoButton() {
            document.getElementById('sub').click();
        }


        function updateTimer() {
            if (remainingTime > 0) {
                remainingTime--;
                let minutes = Math.floor(remainingTime / 60);
                let seconds = remainingTime % 60;
                timerElement.innerText = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
                setTimeout(updateTimer, 1000); // Calls updateTimer after 1 sec everytime till 0
            } else if (timerActive) {
                timerActive = false; // Prevent multiple form submissions (since there is a sleep of 1 sec)
                if (quizForm) {
                    console.log("Please check for timer...");
                   

                    AutoButton();  
                }
            }
        }

        // Start timer when page loads
        updateTimer();
    </script>

</body>
</html>
