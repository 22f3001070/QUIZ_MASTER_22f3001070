<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Summary</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href=
    "{{ url_for('static', filename='images/logo.png') }}"
            type="image/x-icon" />
    
    <style>
        body {
            background-color: rgb(124, 150, 177);
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='images/pic_12.jpg') }}"); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .container {
            margin-top: 20px;
        }
        .summary-box {
            background: rgba(235, 222, 43, 0.69);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .chart-container {
            background: rgba(186, 56, 238, 0.69);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        header.logo
        {
            position: absolute;
            right: 30px;
            top: 13.3px;
            
            height:10px;
            margin-top: 5px 0;
            box-shadow: 0px 4px 22px rgba(37, 214, 152, 0.86);
            
        }
        h2.h{
            color: blue;
            background: rgba(40, 221, 170, 0.66);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="h">Summary of User Performances</h2>
        <header class="logo">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Quiz Master Logo" width="55" >
        </header>

        <div class="row mt-4">
            <div class="col-md-3">
                <div class="summary-box">
                    <h4>Total Users</h4>
                    <p class="fs-3 text-primary">{{ user_count }}</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-box">
                    <h4>Total Quizzes</h4>
                    <p class="fs-3 text-primary">{{ quiz_count }}</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-box">
                    <h4>Total Subjects</h4>
                    <p class="fs-3 text-primary">{{ subject_count }}</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-box">
                    <h4>Average Score (%)</h4>
                    <p class="fs-3 text-primary">{{ avg_score }}</p>
                </div>
            </div>
        </div>

        <div class="chart-container">
            <h3 class="text-center"><strong>Quizzes Per Subject</strong></h3>
            {{ bar_chart_html|safe }}
        </div>

        <div class="chart-container">
            <h3 class="text-center"><strong>Subject-wise Performance</strong></h3>
            {{ perf_chart_html|safe }}
        </div>

        <div class="text-center mt-4">
            <a href="{{ url_for('controllers.admin_dashboard') }}" class="btn btn-primary">Return to Dashboard</a>
        </div>
    </div>

</body>
</html>
